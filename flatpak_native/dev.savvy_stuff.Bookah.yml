app-id: dev.savvy_stuff.Bookah
branch: stable
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: bookah_flatpak
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: bookah
    buildsystem: simple
    build-commands:
      # Create target directories
      - mkdir -p /app/share/bookah
      - mkdir -p /app/bin
      
      # Copy the pre-built PyInstaller contents (which are in the current dir)
      - cp -a . /app/share/bookah/

      # Remove bundled system libraries that cause GLIBC mismatches (avoids 'GLIBC_2.43 not found' error)
      # These libraries should instead be provided by the Flatpak runtime.
      # Note: We must KEEP libexpat.so.1 as it is required by pyexpat and compatible with the runtime.
      - |
        cd /app/share/bookah/_internal
        for lib in libglib-2.0.so.0 libgio-2.0.so.0 libgobject-2.0.so.0 libgmodule-2.0.so.0 libgthread-2.0.so.0 \
                   libavcodec.so.62 libgnutls.so.30 libjxl.so.0.11 libmp3lame.so.0 libmvec.so.1; do
          [ -f "$lib" ] && rm "$lib"
        done
      
      # Fix line endings for launcher (Windows compatibility)
      - sed -i 's/\r$//' bookah_flatpak
      
      # Fix line endings for desktop file
      - sed -i 's/\r$//' dev.savvy_stuff.Bookah.desktop
      
      # Fix line endings for metainfo file
      - sed -i 's/\r$//' dev.savvy_stuff.Bookah.metainfo.xml

      # Install launcher
      - install -D bookah_flatpak /app/bin/bookah_flatpak
      - chmod +x /app/bin/bookah_flatpak
      
      # Install Metadata
      - install -D dev.savvy_stuff.Bookah.desktop /app/share/applications/dev.savvy_stuff.Bookah.desktop
      - install -D dev.savvy_stuff.Bookah.metainfo.xml /app/share/metainfo/dev.savvy_stuff.Bookah.metainfo.xml
      - install -D icons/bookah_flatpak_icon.png /app/share/icons/hicolor/512x512/apps/dev.savvy_stuff.Bookah.png
    sources:
      # This points to the folder containing the PyInstaller output
      - type: dir
        path: ../dist/Bookah_Linux
      # These files are in the flatpak_native directory itself
      - type: file
        path: bookah_flatpak
      - type: file
        path: dev.savvy_stuff.Bookah.desktop
      - type: file
        path: dev.savvy_stuff.Bookah.metainfo.xml
      # Include icons from the main project
      - type: dir
        path: ../icons
        dest: icons
